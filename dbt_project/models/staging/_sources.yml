version: 2

sources:
  - name: raw
    description: Files exactly as received, loaded by scripts/load_raw.py. Never modified by dbt.
    schema: raw
    tables:
      - name: raw_movements
        description: One row per source CSV row. All business fields are kept as text.
        columns:
          - name: load_id
            data_tests: [not_null]
          - name: source_file
            data_tests: [not_null]
          - name: source_row_number
            data_tests: [not_null]
      - name: load_log
        description: One row per loaded file; sha256 makes loading idempotent.
        columns:
          - name: load_id
            data_tests: [unique, not_null]
          - name: file_sha256
            data_tests: [unique, not_null]
