<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Pipeline Lineage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f7f9; --panel:#ffffff; --sunk:#eef2f5; --fg:#16202a; --muted:#5a6674; --line:#d6dde4;
  --accent:#17708c; --accent-soft:#e0eff4; --on-accent:#ffffff;
  --src:#9a5b00; --src-soft:#fbefd9; --view:#6247b8; --view-soft:#ece8fb; --tbl:#17708c; --tbl-soft:#e0eff4;
  --ok:#1b7a44; --ok-soft:#e1f3e8; --bad:#b3362e; --bad-soft:#fbe6e4; --warn:#9a6400; --warn-soft:#fbf0d8;
  --chg:#6247b8; --chg-soft:#efeafd;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --panel:#161d25; --sunk:#111820; --fg:#e5eaf0; --muted:#95a1af; --line:#2c3743;
  --accent:#5db7d4; --accent-soft:#14303b; --on-accent:#08131a;
  --src:#e3b25f; --src-soft:#33270f; --view:#b3a1ff; --view-soft:#251f3d; --tbl:#5db7d4; --tbl-soft:#14303b;
  --ok:#62cf8f; --ok-soft:#14301f; --bad:#f08a80; --bad-soft:#3a1c1a; --warn:#e5b45a; --warn-soft:#342811;
  --chg:#b3a1ff; --chg-soft:#2a2244; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --panel:#161d25; --sunk:#111820; --fg:#e5eaf0; --muted:#95a1af; --line:#2c3743;
  --accent:#5db7d4; --accent-soft:#14303b; --on-accent:#08131a;
  --src:#e3b25f; --src-soft:#33270f; --view:#b3a1ff; --view-soft:#251f3d; --tbl:#5db7d4; --tbl-soft:#14303b;
  --ok:#62cf8f; --ok-soft:#14301f; --bad:#f08a80; --bad-soft:#3a1c1a; --warn:#e5b45a; --warn-soft:#342811;
  --chg:#b3a1ff; --chg-soft:#2a2244; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
.wrap{max-width:1440px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:1.45rem;letter-spacing:-.01em}
h2{margin:0;font-size:1.1rem;font-family:var(--mono)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:7px;font-size:.86rem;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
button:focus-visible,[data-node]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.graph{position:sticky;top:12px}
@media (max-width:1100px){.graph{position:static}}
.graphbox{overflow-x:auto}
svg.dag{display:block;min-width:540px;width:100%;height:auto}
.dag .edge{fill:none;stroke:var(--line);stroke-width:2}
.dag .edge.hot{stroke:var(--accent);stroke-width:2.5}
.dag .node{cursor:pointer}
.dag .node rect{stroke-width:1.5}
.dag .node.source rect{fill:var(--src-soft);stroke:var(--src)}
.dag .node.view rect{fill:var(--view-soft);stroke:var(--view)}
.dag .node.table rect{fill:var(--tbl-soft);stroke:var(--tbl)}
.dag .node.files rect{fill:var(--sunk);stroke:var(--muted);stroke-dasharray:4 3}
.dag .node.sel rect{stroke-width:3.5}
.dag .node.building rect{stroke:var(--warn);stroke-width:3.5}
.dag .node.pending{opacity:.3}
.dag text{font-family:var(--sans)}
.dag .nm{fill:var(--fg);font-family:var(--mono);font-size:13px;font-weight:600}
.dag .what{fill:var(--fg);font-size:12px}
.dag .sub{fill:var(--muted);font-size:11px}
.dag .layer{fill:var(--muted);font-size:10.5px;letter-spacing:.08em;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;padding:1px 8px;border-radius:99px;font-size:.74rem;font-weight:600;white-space:nowrap}
.chip.src{background:var(--src-soft);color:var(--src)} .chip.view{background:var(--view-soft);color:var(--view)}
.chip.table{background:var(--tbl-soft);color:var(--tbl)} .chip.plain{background:var(--sunk);color:var(--muted)}
.chip.accepted{background:var(--ok-soft);color:var(--ok)} .chip.rejected{background:var(--bad-soft);color:var(--bad)} .chip.duplicate{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.ref{font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 6px;white-space:nowrap}
.what-line{color:var(--muted);font-size:.9rem}
.btn{font:inherit;font-weight:600;font-size:.85rem;padding:6px 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.subtabs button{all:unset;cursor:pointer;padding:7px 12px;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent}
.subtabs button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tbox{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:620px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:var(--sunk);font-weight:500;color:var(--muted);font-size:.72rem}
tr:last-child td{border-bottom:0}
td.num{text-align:right} td.neg{color:var(--bad);font-weight:600}
tr.bad td{background:var(--bad-soft)} tr.dup td{background:var(--warn-soft)} tr.chg td{background:var(--chg-soft)}
.null{color:var(--muted);font-style:italic}
pre.code{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 0;overflow:auto;max-height:620px;font:12.5px/1.6 var(--mono);counter-reset:ln}
pre.code span.l{display:block;padding-right:14px;white-space:pre}
pre.code span.l::before{counter-increment:ln;content:counter(ln);display:inline-block;width:3.2em;padding-right:1em;text-align:right;color:var(--muted);opacity:.6;user-select:none}
pre.code .cm{color:var(--muted);font-style:italic} pre.code .kw{color:var(--accent);font-weight:600} pre.code .jj{color:var(--view)}
.small{font-size:.8rem} .muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Inventory pipeline</h1>
    <div class="seg" id="stages" role="group" aria-label="Data as it was after"></div>
  </header>
  <div class="layout">
    <section class="card graph" id="graph"></section>
    <section class="card" id="detail"></section>
  </div>
</div>

<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("report-data").textContent);
const R = DATA.report, NODES = (DATA.dbt && DATA.dbt.nodes) || {}, REPO = DATA.repo || [];
const STAGES = R.stages || [];
const state = {stage: 0, node: null, sub: "data", replay: null};

const WHAT = {
  "files": "CSV files from the warehouses",
  "raw.raw_movements": "every CSV row, kept as text",
  "raw.load_log": "files already loaded (skip repeats)",
  "stg_movements": "type each field, check the rules",
  "int_movements_classified": "accepted / rejected / duplicate",
  "clean_movements": "accepted rows, signed quantity",
  "rejected_movements": "invalid rows + reason",
  "movement_reconciliation": "row counts per file",
  "int_daily_activity": "in / out / adjustment per day",
  "daily_inventory": "every day, running balance",
};
const REFS = {"raw.raw_movements": "§3", "raw.load_log": "§4.3", stg_movements: "§3.1", int_movements_classified: "§3.1",
  clean_movements: "§3.2", rejected_movements: "§3.2", movement_reconciliation: "§7", int_daily_activity: "§3",
  daily_inventory: "§3, §3.3"};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => /^-?\d+(\.\d+)?$/.test(v);
const stage = () => STAGES[state.stage];
const prevStage = () => state.stage > 0 ? STAGES[state.stage - 1] : null;
const label = n => n.kind === "source" ? n.relation : n.name;
const kindOf = n => n.kind === "files" ? "files" : n.kind === "source" ? "source" : (n.materialized === "view" ? "view" : "table");
const kindLabel = n => n.kind === "files" ? "loaded by scripts/load_raw.py" : n.kind === "source" ? "raw table" : n.materialized === "view" ? "view" : "table";
const FILES_ID = "files";
function graphNodes(){
  const g = Object.entries(NODES).filter(([,n]) => n.kind === "model" || n.kind === "source").map(([id,n]) => ({id, ...n, layer: n.layer + 1}));
  g.push({id: FILES_ID, kind: "files", name: "CSV files", relation: "", layer: 0, depends_on: []});
  g.filter(n => n.kind === "source").forEach(n => n.depends_on = [FILES_ID]);
  return g;
}

function highlightSql(code){
  const kws = /\b(select|from|where|with|as|join|left|on|and|or|not|in|is|null|case|when|then|else|end|group|by|order|over|partition|rows|between|unbounded|preceding|current|row|sum|count|min|max|filter|union|all|except|distinct|cast|having|cross|coalesce|window|create|table|view|insert|into|limit)\b/gi;
  return code.split("\n").map(line => {
    let html = esc(line), tail = "";
    const c = html.indexOf("--");
    if (c >= 0){ tail = `<span class="cm">${html.slice(c)}</span>`; html = html.slice(0, c); }
    html = html.replace(/(\{\{.*?\}\}|\{%.*?%\}|\{#.*?#\})/g, '<span class="jj">$1</span>');
    html = html.replace(/(<span[^>]*>.*?<\/span>)|([^<]+)/g, (m, span, text) => span ? span : text.replace(kws, '<span class="kw">$1</span>'));
    return `<span class="l">${html}${tail}</span>`;
  }).join("");
}
const codeBlock = (code, sql=true) => `<pre class="code">${sql ? highlightSql(code || "") : (code || "").split("\n").map(l => `<span class="l">${esc(l)}</span>`).join("")}</pre>`;

function cellHtml(col, v){
  if (v === "" || v === null || v === undefined) return `<td class="null">NULL</td>`;
  if (col === "row_status") return `<td><span class="chip ${esc(v)}">${esc(v)}</span></td>`;
  if (col === "negative_balance") return v === "true" ? `<td><span class="chip bad">true</span></td>` : `<td>false</td>`;
  if (isNum(v)) return `<td class="num${Number(v) < 0 && /quantity|closing|opening|net|signed/.test(col) ? " neg" : ""}">${esc(v)}</td>`;
  return `<td>${esc(v)}</td>`;
}
function dataTable(t, compare){
  if (!t) return `<p class="muted">No data.</p>`;
  const base = compare ? new Set(compare.rows.map(r => JSON.stringify(r))) : null;
  const ci = c => t.columns.indexOf(c);
  const rows = t.rows.map(r => {
    let cls = "";
    if (ci("row_status") >= 0) cls = r[ci("row_status")] === "rejected" ? "bad" : r[ci("row_status")] === "duplicate" ? "dup" : "";
    else if (ci("rejection_reason") >= 0 && r[ci("rejection_reason")]) cls = "bad";
    if (base && !base.has(JSON.stringify(r))) cls = "chg";
    return `<tr class="${cls}">${r.map((v,i) => cellHtml(t.columns[i], v)).join("")}</tr>`;
  }).join("");
  const more = t.total > t.rows.length ? `<p class="small muted">${t.rows.length} of ${t.total.toLocaleString()} rows shown</p>` : "";
  return `<div class="tbox"><table><thead><tr>${t.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>${more}`;
}
const legend = items => `<div class="legend">${items.map(([v,l]) => `<span><i style="background:var(${v})"></i>${esc(l)}</span>`).join("")}</div>`;

const NW = 236, NH = 70, GX = 26, GY = 40, LX = 96, PAD = 18;
function layout(){
  const g = graphNodes(), layers = {};
  g.forEach(n => (layers[n.layer] = layers[n.layer] || []).push(n));
  const order = ["files","source","view","table"];
  Object.values(layers).forEach(l => l.sort((a,b) => (b.name === "raw_movements") - (a.name === "raw_movements") || a.name.localeCompare(b.name)));
  const maxPer = Math.max(...Object.values(layers).map(l => l.length));
  const W = LX + maxPer*NW + (maxPer-1)*GX + PAD;
  const pos = {};
  Object.entries(layers).forEach(([L, list]) => {
    const rowW = list.length*NW + (list.length-1)*GX, x0 = LX + (W - LX - PAD - rowW)/2;
    list.forEach((n,i) => pos[n.id] = {x: x0 + i*(NW+GX), y: PAD + Number(L)*(NH+GY)});
  });
  return {g, pos, W, H: PAD*2 + Object.keys(layers).length*(NH+GY) - GY, layers};
}
function layerName(list){
  const n = list[0];
  if (n.kind === "files") return "INPUT";
  if (n.kind === "source") return "LOAD";
  return n.path.includes("/staging/") ? "STAGING" : n.path.includes("/intermediate/") ? "INTERMEDIATE" : "MARTS";
}
function rowsOf(n){ const t = n.kind === "files" ? null : stage().tables[n.relation]; return t ? t.total : null; }
function dagSvg(){
  const {g, pos, W, H, layers} = layout(), sel = state.node, rp = state.replay;
  const edges = [];
  g.forEach(n => (n.depends_on || []).forEach(d => { if (pos[d]) edges.push([d, n.id]); }));
  const edgeSvg = edges.map(([a,b]) => {
    const p = pos[a], q = pos[b], x1 = p.x+NW/2, y1 = p.y+NH, x2 = q.x+NW/2, y2 = q.y, my = (y1+y2)/2;
    return `<path class="edge${sel && (a === sel || b === sel) ? " hot" : ""}" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2-2}" marker-end="url(#arr)"/>`;
  }).join("");
  const layerSvg = Object.entries(layers).map(([L,list]) => `<text class="layer" x="${PAD}" y="${PAD + Number(L)*(NH+GY) + NH/2 + 4}">${layerName(list)}</text>`).join("");
  const nodeSvg = g.map(n => {
    const p = pos[n.id], rows = rowsOf(n), key = n.kind === "source" ? n.relation : n.kind === "files" ? "files" : n.name;
    const cls = rp ? (rp.done.has(n.id) ? "" : rp.current === n.id ? " building" : " pending") : "";
    return `<g class="node ${kindOf(n)}${n.id === sel ? " sel" : ""}${cls}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(label(n))}">
      <rect x="${p.x}" y="${p.y}" width="${NW}" height="${NH}" rx="10"></rect>
      <text class="nm" x="${p.x+12}" y="${p.y+21}">${esc(n.kind === "files" ? "CSV files" : label(n))}</text>
      <text class="what" x="${p.x+12}" y="${p.y+40}">${esc(WHAT[key] || "")}</text>
      <text class="sub" x="${p.x+12}" y="${p.y+58}">${esc(kindLabel(n))}${rows !== null ? ` · ${rows.toLocaleString()} rows` : ""}</text>
    </g>`;
  }).join("");
  return `<svg class="dag" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pipeline flowchart">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs>
    ${layerSvg}${edgeSvg}${nodeSvg}</svg>`;
}
function renderGraph(){
  document.getElementById("graph").innerHTML = `
    <div class="row" style="justify-content:space-between">
      ${legend([["--src-soft","raw table"],["--view-soft","view"],["--tbl-soft","table"]])}
      <button type="button" class="btn" id="replay" ${state.replay ? "disabled" : ""}>▶ Replay build</button>
    </div>
    <div class="graphbox">${dagSvg()}</div>
    ${state.replay ? `<p class="small muted">${esc(state.replay.msg)}</p>` : ""}`;
}

function renderDetail(){
  const g = graphNodes();
  if (!state.node || !g.find(n => n.id === state.node)) state.node = (g.find(n => n.name === "daily_inventory") || g[0]).id;
  const n = g.find(x => x.id === state.node), st = stage();
  const key = n.kind === "source" ? n.relation : n.kind === "files" ? "files" : n.name;
  const loader = REPO.find(f => f.path === "scripts/load_raw.py");
  if (n.kind === "files"){
    const files = REPO.filter(f => /^data\/fixture\/batch_.*\.csv$/.test(f.path));
    document.getElementById("detail").innerHTML = `
      <div class="row"><h2>CSV files</h2><span class="chip plain">input</span></div>
      <p class="what-line">${esc(WHAT.files)}, loaded by <code>scripts/load_raw.py</code>.</p>
      ${files.map(f => `<h3 class="small mono" style="margin:0">${esc(f.path)}</h3>${codeBlock(f.content, false)}`).join("")}`;
    return;
  }
  const t = st.tables[n.relation], prev = prevStage(), compare = prev && prev.tables[n.relation];
  const subs = n.kind === "source" ? [["data","Rows"],["sql","Loader code"]] : [["data","Rows"],["sql","SQL"],["compiled","Compiled SQL"]];
  if (!subs.some(([k]) => k === state.sub)) state.sub = "data";
  let body;
  if (state.sub === "data"){
    const lg = [];
    if (t && t.columns.includes("row_status")) lg.push(["--bad-soft","rejected"],["--warn-soft","duplicate"]);
    else if (t && t.columns.includes("rejection_reason")) lg.push(["--bad-soft","rejected"]);
    if (compare && prev.key !== "rerun" && st.key !== "rerun") lg.push(["--chg-soft",`changed since "${prev.title}"`]);
    body = (lg.length ? legend(lg) : "") + dataTable(t, st.key === "rerun" ? null : compare);
  } else if (state.sub === "sql"){
    body = n.kind === "source" ? (loader ? codeBlock(loader.content, false) : "") : codeBlock(n.raw_code);
  } else {
    body = codeBlock(n.compiled_code);
  }
  document.getElementById("detail").innerHTML = `
    <div class="row" style="justify-content:space-between">
      <div class="row"><h2>${esc(label(n))}</h2><span class="chip ${kindOf(n) === "source" ? "src" : kindOf(n)}">${esc(kindLabel(n))}</span>${t ? `<span class="chip plain">${t.total.toLocaleString()} rows</span>` : ""}${REFS[key] ? `<span class="ref" title="Section of the assessment brief">Brief ${REFS[key]}</span>` : ""}</div>
      <code class="small muted">${esc(n.path || "")}</code>
    </div>
    <p class="what-line">${esc(WHAT[key] || "")}</p>
    <div class="subtabs" role="group" aria-label="View">${subs.map(([k,l]) => `<button type="button" data-sub="${k}" aria-pressed="${k === state.sub}">${l}</button>`).join("")}</div>
    ${body}`;
}

function renderStages(){
  document.getElementById("stages").innerHTML = STAGES.map((s,i) =>
    `<button type="button" data-stage="${i}" aria-pressed="${i === state.stage}">${esc(s.title)}</button>`).join("");
}
function render(){ renderStages(); renderGraph(); renderDetail(); }

function replayBuild(){
  const st = stage(), g = graphNodes(), order = [FILES_ID];
  g.filter(n => n.kind === "source").forEach(n => order.push(n.id));
  (st.dbt_results || []).forEach(r => { if (r.unique_id.startsWith("model.") && !order.includes(r.unique_id)) order.push(r.unique_id); });
  g.forEach(n => { if (!order.includes(n.id)) order.push(n.id); });
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  state.replay = {done: new Set(), current: null, msg: ""};
  let i = 0;
  const tick = () => {
    if (i > 0) state.replay.done.add(order[i-1]);
    if (i >= order.length){ state.replay.msg = "Built in dependency order."; renderGraph(); setTimeout(() => { state.replay = null; renderGraph(); }, 1500); return; }
    const n = g.find(x => x.id === order[i]);
    state.replay.current = order[i];
    state.replay.msg = `${i+1}/${order.length} · ${n.kind === "files" ? "CSV files" : label(n)}: ${WHAT[n.kind === "source" ? n.relation : n.kind === "files" ? "files" : n.name] || ""}`;
    renderGraph(); i++; setTimeout(tick, reduce ? 0 : 700);
  };
  tick();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-stage],[data-node],[data-sub],#replay");
  if (!t) return;
  if (t.id === "replay"){ replayBuild(); return; }
  if (t.dataset.stage !== undefined) state.stage = Number(t.dataset.stage);
  else if (t.dataset.node) state.node = t.dataset.node;
  else if (t.dataset.sub) state.sub = t.dataset.sub;
  render();
});
document.addEventListener("keydown", e => {
  const n = e.target.closest && e.target.closest("[data-node]");
  if (n && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); state.node = n.dataset.node; render(); }
});
if (STAGES.length) render(); else document.getElementById("detail").textContent = "No run data captured.";
</script>
</body>
</html>
