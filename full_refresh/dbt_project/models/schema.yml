version: 2

models:
  - name: stg_movements
    description: One row per raw row - trimmed, typed, with at most one rejection_reason (first failing rule).
    columns:
      - name: raw_row_id
        description: "<load_id>-<source_row_number>; stable identifier of one input row."
        data_tests: [unique, not_null]
      - name: rejection_reason
        data_tests:
          - accepted_values:
              arguments:
                values: &rejection_reasons
                  - missing_movement_id
                  - missing_product_id
                  - missing_warehouse_id
                  - missing_movement_type
                  - missing_quantity
                  - missing_event_timestamp
                  - invalid_movement_type
                  - non_integer_quantity
                  - unparseable_event_timestamp
                  - non_positive_quantity
                  - zero_adjustment_quantity

  - name: int_movements_classified
    description: Every raw row with a final row_status (accepted / rejected / duplicate).
    columns:
      - name: raw_row_id
        data_tests: [unique, not_null]
      - name: row_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [accepted, rejected, duplicate]

  - name: int_daily_activity
    description: Receipt / shipment / adjustment totals per product, warehouse and active day.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_id, warehouse_id, activity_date]

  - name: clean_movements
    description: One row per accepted movement_id with business_date and signed_quantity.
    data_tests:
      - expression_is_true:
          arguments:
            expression: >
              (movement_type = 'receipt'    and quantity > 0  and signed_quantity = quantity)
              or (movement_type = 'shipment'   and quantity > 0  and signed_quantity = -quantity)
              or (movement_type = 'adjustment' and quantity <> 0 and signed_quantity = quantity)
    columns:
      - name: movement_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [not_null]
      - name: warehouse_id
        data_tests: [not_null]
      - name: movement_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [receipt, shipment, adjustment]
      - name: business_date
        data_tests: [not_null]
      - name: quantity
        data_tests: [not_null]
      - name: signed_quantity
        data_tests: [not_null]
      - name: raw_row_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_movements_classified')
                field: raw_row_id

  - name: rejected_movements
    description: One row per invalid source row with its rejection_reason.
    columns:
      - name: raw_row_id
        data_tests: [unique, not_null]
      - name: rejection_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: *rejection_reasons

  - name: daily_inventory
    description: >
      One row per product, warehouse and date from the combination's first valid movement
      through the latest valid movement date in the dataset, including days with no activity.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_id, warehouse_id, inventory_date]
      - expression_is_true:
          arguments:
            expression: "received_quantity >= 0 and shipped_quantity >= 0"
    columns:
      - name: product_id
        data_tests: [not_null]
      - name: warehouse_id
        data_tests: [not_null]
      - name: inventory_date
        data_tests: [not_null]
      - name: opening_quantity
        data_tests: [not_null]
      - name: received_quantity
        data_tests: [not_null]
      - name: shipped_quantity
        data_tests: [not_null]
      - name: adjustment_quantity
        data_tests: [not_null]
      - name: closing_quantity
        data_tests: [not_null]
      - name: negative_balance
        data_tests: [not_null]

  - name: movement_reconciliation
    description: Per loaded file, raw_rows = accepted_rows + rejected_rows + duplicate_rows.
    data_tests:
      - expression_is_true:
          arguments:
            expression: "raw_rows = accepted_rows + rejected_rows + duplicate_rows"
